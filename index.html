<!DOCTYPE html>
<html>
<!-- v6.00: 当日受付ボードだけの単独ページ (?page=board&id=公演ID)。
     受付用のPC・タブレットで全画面にして使う。読み書きには受付スタッフのキー (スタッフ端末の登録と同じ) が要る。
     ボードの見た目・中身は CheckinBoardCss / CheckinBoardCore (管理画面と共通)。 -->
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>当日受付ボード</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f1f5f9; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", sans-serif; }
    .bp-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #0f172a; color: #fff; }
    .bp-bar h1 { margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .bp-bar .live { font-size: 12px; color: #86efac; white-space: nowrap; }
    .bp-bar .live.off { color: #fca5a5; }
    .bp-bar button { font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; cursor: pointer; white-space: nowrap; }
    .bp-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 4px; animation: bpPulse 2s infinite; }
    .live.off .bp-dot { background: #ef4444; animation: none; }
    @keyframes bpPulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .bp-main { padding: 10px 14px 0; }
    .bp-gate { max-width: 420px; margin: 12vh auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
    .bp-gate h2 { margin: 0 0 8px; font-size: 20px; }
    .bp-gate p { font-size: 13px; color: #475569; line-height: 1.7; }
    .bp-gate input { width: 100%; font-size: 22px; letter-spacing: .15em; text-transform: uppercase; padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 10px; }
    .bp-gate button { margin-top: 12px; width: 100%; font-size: 16px; font-weight: 700; padding: 12px; border: 0; border-radius: 10px; background: #16a34a; color: #fff; cursor: pointer; }
    .bp-err { color: #b91c1c; font-size: 13px; margin-top: 8px; }
    #bp-toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
    #bp-toast.show { opacity: .95; }
    #bp-toast.error { background: #b91c1c; }
    .hint { color: #64748b; font-size: 12px; }
    .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid #cbd5e1; border-top-color: #0f172a; border-radius: 50%; animation: bpSpin .8s linear infinite; vertical-align: -2px; }
    @keyframes bpSpin { to { transform: rotate(360deg); } }
        /* v6.00: 当日受付ボードの見た目 (管理画面 Index.html と単独ページ Board.html で共通)
       v7.39: 作り直し。左 = 予約の一覧 (カードの形を固定して崩れない)、右 = 選んだ人 + 席表 (常に表示) + 最近の入場 (折りたたみ)
         色の意味をそろえる: 緑 = 入場/済み、青 = まだ、オレンジ = お金・要対応、黄 = 特典、ピンク = 推し */
    #board-panel { container-type: inline-size; --bd-line: #e2e8f0; --bd-sub: #64748b; --bd-ink: #0f172a; }

    /* ---- 上: 回の選択と数字 (1行) ---- */
    .bd-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; margin-bottom: 8px; }
    .bd-top select { font-size: 16px; font-weight: 700; padding: 8px 10px; min-width: 220px; border-radius: 10px; }
    .bd-prog { flex: 1 1 220px; min-width: 200px; border: 1px solid var(--bd-line); border-radius: 10px; padding: 6px 12px; background: #fff; display: flex; flex-direction: column; justify-content: center; }
    .bd-prog .l { display: flex; align-items: baseline; gap: 6px; }
    .bd-prog .l span { font-size: 12px; font-weight: 700; color: var(--bd-sub); }
    .bd-prog .l b { font-size: 24px; font-weight: 800; color: #15803d; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .bd-prog .l small { font-size: 13px; color: var(--bd-sub); font-weight: 600; }
    .bd-bar { height: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
    .bd-bar i { display: block; height: 100%; background: #22c55e; }
    .bd-stat { border: 1px solid var(--bd-line); border-radius: 10px; padding: 6px 12px; background: #fff; display: flex; flex-direction: column; justify-content: center; min-width: 96px; }
    .bd-stat span { font-size: 11px; font-weight: 700; color: var(--bd-sub); white-space: nowrap; }
    .bd-stat b { font-size: 20px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bd-stat b small { font-size: 12px; font-weight: 600; color: var(--bd-sub); margin-left: 2px; }
    .bd-stat.warn { border-color: #fdba74; background: #fff7ed; } .bd-stat.warn b { color: #c2410c; }
    .bd-stat.gift { border-color: #fcd34d; background: #fffbeb; } .bd-stat.gift b { color: #92400e; }
    .bd-stat.ok b { color: #15803d; }
    .bd-search { width: 100%; font-size: 17px; padding: 9px 12px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 8px; box-sizing: border-box; }

    /* ---- 本体: 左右2列。高さは画面の残り (_bdFit_)、それぞれの中でスクロール ---- */
    .bd-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; height: 520px; }
    .bd-left, .bd-right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .bd-right { gap: 8px; overflow-y: auto; padding-right: 2px; }
    .bd-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-bottom: 6px; }
    .bd-tabs button { border: 1px solid #cbd5e1; background: #fff; color: #475569; border-radius: 9px; padding: 8px 6px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .bd-tabs button b { font-size: 15px; margin-left: 2px; }
    .bd-tabs button.on { background: var(--bd-ink); border-color: var(--bd-ink); color: #fff; }
    .bd-tabs button.warn:not(.on) { border-color: #fdba74; color: #c2410c; background: #fff7ed; }
    .bd-tabs button.gift:not(.on) { border-color: #fcd34d; color: #92400e; background: #fffbeb; }
    .bd-sort { display: inline-flex; align-self: flex-start; align-items: center; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #fff; margin-bottom: 6px; }
    .bd-sort span { font-size: 11px; color: var(--bd-sub); padding: 0 8px; }
    .bd-sort button { border: 0; border-left: 1px solid var(--bd-line); background: #fff; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #475569; cursor: pointer; }
    .bd-sort button.on { background: var(--bd-ink); color: #fff; }
    .bd-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 4px 2px 2px; }
    .bd-grp { font-size: 13px; font-weight: 800; color: var(--bd-ink); padding: 6px 2px 2px; border-bottom: 2px solid var(--bd-line); }
    .bd-grp span { font-size: 11px; font-weight: 600; color: var(--bd-sub); margin-left: 6px; }
    .bd-empty { color: #94a3b8; font-size: 13px; padding: 16px 0; text-align: center; }

    /* ---- カード: 名前 / 1行のチップ / メモ | 枚数 | 操作。形を固定して、長い文字は … で切る ---- */
    .bc { display: grid; grid-template-columns: minmax(0, 1fr) 52px 104px; gap: 10px; align-items: center; border: 1px solid var(--bd-line); border-left: 4px solid #93c5fd; border-radius: 10px; padding: 8px 10px; background: #fff; cursor: pointer; }
    .bc.attn { border-left-color: #f97316; background: #fffbf5; }
    .bc.done { border-left-color: #22c55e; }
    .bc.gift { border-left-color: #f59e0b; } .bc.gift.now { background: #fffbeb; }
    .bc.focus { box-shadow: 0 0 0 3px #1d4ed8; }
    .bc-main { min-width: 0; }
    .bc-l1, .bc-l2 { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
    .bc-l2 { margin-top: 4px; }
    .bc-name { font-size: 17px; font-weight: 800; color: var(--bd-ink); overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
    .bc-kana { font-size: 11.5px; color: var(--bd-sub); overflow: hidden; text-overflow: ellipsis; flex-shrink: 2; min-width: 0; }
    .bc-time { font-size: 11.5px; color: #15803d; font-weight: 700; margin-left: auto; flex-shrink: 0; }
    .bc-seat { flex-shrink: 0; font-size: 14px; font-weight: 800; color: var(--bd-ink); background: #e2e8f0; border-radius: 6px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
    .bc-seat.free { font-size: 12px; font-weight: 700; color: var(--bd-sub); background: #f1f5f9; }
    .bc-oshi { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #9d174d; background: #fdf2f8; border: 1px solid #fbcfe8; border-radius: 6px; padding: 1px 8px; }
    .bc-oshi b { font-size: 15px; font-weight: 800; }
    .bc-gift { flex-shrink: 0; font-size: 13px; font-weight: 800; color: #92400e; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 1px 8px; }
    .bc-gift b { font-size: 15px; }
    .bc-gift.done { color: var(--bd-sub); background: #f1f5f9; border-color: var(--bd-line); }
    .bc-oshi.sm b, .bc-gift.sm { font-size: 12px; }
    .bc-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
    .bc-tag.due { background: #fee2e2; color: #991b1b; } .bc-tag.hold { background: #fef3c7; color: #92400e; }
    .bc-tag.inv { background: #ede9fe; color: #5b21b6; } .bc-tag.rel { background: #e0f2fe; color: #075985; } .bc-tag.gene { background: #ffe4e6; color: #9f1239; }
    .bc-tt { font-size: 11.5px; color: var(--bd-sub); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .bc-note, .bc-memo { margin-top: 4px; font-size: 12.5px; border-radius: 6px; padding: 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bc-note { color: #1e3a8a; background: #eff6ff; font-weight: 700; }
    .bc-memo { color: #92400e; background: #fffbeb; }
    .bc-cnt { text-align: center; border-radius: 8px; background: #f1f5f9; color: #334155; font-size: 11px; font-weight: 700; padding: 3px 0; line-height: 1.1; }
    .bc-cnt b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .bc-cnt.multi { background: #dbeafe; color: #1e3a8a; }
    .bc-act { display: flex; flex-direction: column; gap: 4px; }
    .bc-go { border: 0; border-radius: 9px; padding: 11px 6px; font-size: 15px; font-weight: 800; cursor: pointer; background: #16a34a; color: #fff; white-space: nowrap; }
    .bc-go.pay { background: #ea580c; padding: 8px 4px; font-size: 13px; } .bc-go.csl { background: #0369a1; padding: 8px 4px; font-size: 13px; }
    .bc-go.gift { background: #f59e0b; } .bc-go.gift.on { background: #e2e8f0; color: #475569; }
    .bc-sub { border: 1px solid var(--bd-line); background: #fff; color: #475569; border-radius: 7px; padding: 4px 4px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .bc-sub.gift { border-color: #fcd34d; color: #92400e; background: #fffbeb; } .bc-sub.gift.on { border-color: #bbf7d0; color: #166534; background: #f0fdf4; }

    /* ---- 右: 選んだ人 ---- */
    .bd-sel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 2px solid #1d4ed8; border-radius: 12px; padding: 8px 12px; background: #eff6ff; }
    .bd-sel.empty { display: block; border: 1px dashed #cbd5e1; background: #f8fafc; color: #94a3b8; font-size: 12.5px; text-align: center; padding: 10px; }
    .bd-sel-main { min-width: 0; }
    .bd-sel .bc-time { color: #1e3a8a; }
    .bd-sel .bc-act { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: stretch; max-width: 300px; }
    .bd-sel .bc-l2 { flex-wrap: wrap; white-space: normal; row-gap: 4px; } .bd-sel .bc-oshi { overflow: visible; }
    .bd-sel .bc-go { padding: 9px 16px; } .bd-sel .bc-sub { padding: 6px 10px; }
    .bd-sel .bc-time { margin-left: 8px; }

    /* ---- 右: 席表 (常に表示)。席の大きさは右の列の幅に合わせる ---- */
    .bd-map { border: 1px solid var(--bd-line); border-radius: 12px; padding: 8px 10px 10px; background: #fff; container-type: inline-size; }
    .bd-maphead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: #334155; margin-bottom: 6px; }
    .bd-maphead b { font-size: 14px; margin-right: 4px; }
    .bd-maphead .lg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
    .bd-maphead .lg.free { color: var(--bd-sub); }
    .bd-maphead i.bs-in { background: #16a34a; } .bd-maphead i.bs-resv { background: #bfdbfe; border: 1px solid #60a5fa; } .bd-maphead i.bs-empty { background: #f8fafc; border: 1px solid #cbd5e1; } .bd-maphead i.bs-gift { box-shadow: inset 0 0 0 3px #f59e0b; }
    .bd-stage { text-align: center; background: #1e293b; color: #f1f5f9; border-radius: 6px; font-weight: 700; font-size: 12px; letter-spacing: .4em; padding: 4px; margin: 0 8% 8px; }
    .bd-seatgrid { display: grid; gap: 3px; }
    .bd-seat { aspect-ratio: 1.55 / 1; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; white-space: nowrap;
      font-size: clamp(8px, calc(100cqi / var(--cols, 12) * 0.32), 13px); }
    .bd-seat.bs-gap { background: transparent; }
    .bd-seat.bs-empty { background: #f8fafc; border: 1px solid #e2e8f0; color: #cbd5e1; }
    .bd-seat.bs-resv { background: #bfdbfe; border: 1px solid #60a5fa; color: #1e3a8a; cursor: pointer; }
    .bd-seat.bs-in { background: #16a34a; border: 1px solid #15803d; color: #fff; cursor: pointer; }
    .bd-seat.bs-gift { box-shadow: inset 0 0 0 3px #f59e0b; }
    .bd-seat.bs-hit { outline: 3px solid #dc2626; outline-offset: 1px; }
    .bd-seat.bs-focus { outline: 3px solid #1d4ed8; outline-offset: 1px; animation: bdPulse 1.2s ease-in-out infinite; position: relative; z-index: 1; }
    @keyframes bdPulse { 50% { outline-color: #93c5fd; } }
    .bd-map.nomap { padding: 4px; }

    /* ---- 右: 最近の入場 (折りたたみ) ---- */
    .bd-recent { border: 1px solid var(--bd-line); border-radius: 12px; background: #f8fafc; }
    .bd-recent > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13px; font-weight: 700; color: #334155; }
    .bd-recent > summary::-webkit-details-marker { display: none; }
    .bd-recent > summary::before { content: '▶'; font-size: 10px; color: var(--bd-sub); }
    .bd-recent[open] > summary::before { content: '▼'; }
    .bd-recent > summary b { color: #15803d; }
    .bd-recent > summary em { font-style: normal; font-weight: 600; color: var(--bd-sub); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .bd-recent-list { max-height: 260px; overflow-y: auto; padding: 0 8px 8px; }
    .bd-rr { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-top: 1px dashed var(--bd-line); font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .bd-rr .t { font-weight: 800; color: #15803d; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .bd-rr .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .bd-rr .c { color: var(--bd-sub); flex-shrink: 0; }

    /* ---- 特典: 推しキャスト別の集計 ---- */
    .bd-gtally { background: #fff; border: 1px solid #fcd34d; border-radius: 12px; padding: 8px 10px; }
    .bd-gtally .hd { font-size: 13px; font-weight: 800; color: #92400e; cursor: pointer; user-select: none; }
    .bd-gtally .hd span { font-weight: 600; color: #475569; margin-left: 8px; font-size: 12px; }
    .bd-gtally table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
    .bd-gtally th, .bd-gtally td { padding: 4px 6px; border-bottom: 1px solid #f1f5f9; text-align: right; }
    .bd-gtally th:nth-child(-n+2), .bd-gtally td:nth-child(-n+2) { text-align: left; }
    .bd-gtally th { font-size: 11px; color: var(--bd-sub); font-weight: 700; }
    .bd-gtally tr.now td { background: #fffbeb; }

    /* ---- 狭い画面: 上に選んだ人と席表、下に一覧 (席表は常に見える高さに) ---- */
    @container (max-width: 860px) {
      .bd-layout { grid-template-columns: minmax(0, 1fr); height: auto !important; }
      .bd-right { order: -1; overflow: visible; }
      .bd-map { max-height: 42vh; overflow: auto; }
      .bd-list { max-height: 60vh; }
    }
    @container (max-width: 520px) {
      .bc { grid-template-columns: minmax(0, 1fr) 44px 92px; gap: 6px; padding: 7px 8px; }
      .bd-stat { min-width: 80px; }
    }

    /* v7.41: 席表を半分に、カードも半分の大きさ (2〜3行) にして、一覧を2〜3列で並べる */
    .bd-layout { grid-template-columns: minmax(0, 2.7fr) minmax(0, 1fr); }
    .bd-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 5px; align-content: start; }
    .bd-list > .bd-grp, .bd-list > .bd-gtally, .bd-list > .bd-empty { grid-column: 1 / -1; }
    .bc { grid-template-columns: minmax(0, 1fr) 34px auto; gap: 6px; padding: 4px 6px 4px 8px; border-left-width: 3px; border-radius: 8px; }
    .bc-l2 { margin-top: 2px; gap: 4px; }
    .bc-name { font-size: 14.5px; }
    .bc-kana, .bc-tt, .bc-time { font-size: 10.5px; }
    .bc-seat { font-size: 12px; padding: 0 5px; }
    .bc-seat.free { font-size: 10.5px; }
    .bc-oshi { font-size: 10.5px; padding: 0 6px; } .bc-oshi b { font-size: 13px; }
    .bc-gift { font-size: 11.5px; padding: 0 6px; } .bc-gift b { font-size: 13px; }
    .bc-tag { font-size: 10px; padding: 0 5px; }
    .bc-note, .bc-memo { margin-top: 2px; font-size: 11px; padding: 0 6px; }
    .bc-cnt { padding: 1px 0; font-size: 9.5px; border-radius: 6px; } .bc-cnt b { font-size: 16px; }
    .bc-act { flex-direction: row; align-items: stretch; gap: 3px; }
    .bc-go { padding: 6px 12px; font-size: 13.5px; border-radius: 7px; }
    .bc-go.pay, .bc-go.csl { padding: 6px 7px; font-size: 11.5px; }
    .bc-sub { padding: 3px 7px; font-size: 11px; border-radius: 6px; }
    .bc .bc-sub .lbl { display: none; }
    .bc.done .bc-act, .bc.gift .bc-act { flex-wrap: nowrap; }
    /* 右の列 (席表・選んだ人) は細くなるので、選んだ人の操作は下に並べる */
    .bd-sel { grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 6px 10px; }
    .bd-sel .bc-act { justify-content: flex-start; max-width: none; }
    .bd-sel .bc-go { padding: 6px 14px; }
    .bd-map { padding: 6px 8px 8px; }
    .bd-maphead { font-size: 10.5px; gap: 2px 8px; } .bd-maphead b { font-size: 12px; }
    .bd-stage { font-size: 10px; padding: 2px; margin-bottom: 5px; }
    .bd-seatgrid { gap: 2px; }
    .bd-seat { border-radius: 3px; font-size: clamp(6px, calc(100cqi / var(--cols, 12) * 0.34), 11px); }
    .bd-recent > summary { padding: 7px 10px; font-size: 12px; }
    @container (max-width: 860px) { .bd-layout { grid-template-columns: minmax(0, 1fr); } .bd-map { max-height: 30vh; } }

  </style>
</head>
<body>
  <script>
    const _bpHash_ = (function () {
      const o = {};
      String(location.hash || '').replace(/^#/, '').split('&').forEach(function (p) { const i = p.indexOf('='); if (i > 0) o[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1)); });
      try {
        if (o.api && o.id) localStorage.setItem('lsBoardOpen', JSON.stringify({ api: o.api, id: o.id }));

          /* v6.00: 当日受付ボードの本体 (管理画面 Index.html と単独ページ Board.html で共通)

      /* ---------- 当日受付ボード ---------- */

      function _bdGiftRule_(x) {

          + (on ? '渡した' + (String(x.benefit).replace(/^済\s*/, '') ? ' (' + escapeHtml(String(x.benefit).replace(/^済\s*/, '')) + ')' : '') : 'まだ') + '</label>';

            + '</div>';
        };
        const sortKey = (x) => String(x.kana || x.name || '').normalize('NFKC').replace(/\s/g, '');
        const byName = (a, b) => sortKey(a).localeCompare(sortKey(b), 'ja');
        const list = (arr, kind) => {
          let shown = arr.filter(hit);
          if (!shown.length) return '<div class="bd-empty">' + (q ? '該当なし' : (kind === 'attn' ? '要対応の予約はありません' : 'ありません')) + '</div>';
          if (boardState.sort === 'name') shown = shown.slice().sort(byName);
          if (boardState.sort !== 'cast') return shown.map((x) => card(x, kind)).join('');
          // キャスト順: 推しキャストごとにまとめ、見出しに件数・枚数
          const groups = {};
          shown.forEach((x) => { const c = String(x.support || '').trim() || '(推しなし)'; (groups[c] = groups[c] || []).push(x); });
          const names = Object.keys(groups).sort((a, b) => (a[0] === '(') - (b[0] === '(') || a.localeCompare(b, 'ja'));
          return names.map((c) => {
            const g = groups[c].slice().sort(byName);
            return '<div class="bd-grp">' + escapeHtml(c) + ' <span>' + g.length + '件 / ' + sum(g) + '枚</span></div>' + g.map((x) => card(x, kind)).join('');
          }).join('');
        };
        // v6.14: 推しキャスト別の集計 (この回)。特典の種類ごとに 必要な個数 / 渡した / まだ
        const giftTally = () => {
          const by = {};
          giftAll.forEach((x) => {
            const cast = String(x.support || '').trim() || '(推しなし)';
            const key = cast + '|' + _bdGiftLabel_(x);
            const t = by[key] = by[key] || { cast: cast, label: _bdGiftLabel_(x), need: 0, came: 0, done: 0 };
            const qn = _bdGiftQty_(x);
            t.need += qn;
            if (x.arrival === '到着') t.came += qn;
            if (x.benefit) t.done += qn;
          });
          const rows = Object.keys(by).map((k) => by[k]).sort((a, b) => (a.cast[0] === '(') - (b.cast[0] === '(') || a.cast.localeCompare(b.cast, 'ja'));
          const tot = rows.reduce((s, r) => ({ need: s.need + r.need, done: s.done + r.done }), { need: 0, done: 0 });
          const open = !!boardState.tallyOpen;
          return '<div class="bd-gtally"><div class="hd" onclick="boardState.tallyOpen=' + (open ? 'false' : 'true') + '; renderBoard(false);">' + (open ? '▼' : '▶') + ' 推しキャスト別の集計 (この回) <span>必要 ' + tot.need + '個 / 渡した ' + tot.done + '個 / まだ ' + (tot.need - tot.done) + '個</span></div>'
            + (open ? '<table><thead><tr><th>推しキャスト</th><th>特典</th><th>必要</th><th>来場済</th><th>渡した</th><th>まだ</th></tr></thead><tbody>'
              + rows.map((r) => '<tr' + (r.came > r.done ? ' class="now"' : '') + '><td>' + escapeHtml(r.cast) + '</td><td>' + escapeHtml(r.label) + '</td><td>' + r.need + '</td><td>' + r.came + '</td><td>' + r.done + '</td><td>' + (r.need - r.done) + '</td></tr>').join('')
              + '</tbody></table>' : '') + '</div>';
        };
        const giftList = () => {
          const rank = (x) => (x.arrival === '到着' && !x.benefit ? 0 : (x.arrival !== '到着' ? 1 : 2));
          const rows = giftAll.filter(hit).slice().sort((a, b) => rank(a) - rank(b) || String(a.seats || '').localeCompare(String(b.seats || ''), 'ja', { numeric: true }));
          return giftTally() + (rows.length ? rows.map((x) => card(x, 'gift')).join('') : '<div class="bd-empty">' + (q ? '該当なし' : '特典の対象の予約はありません') + '</div>');
        };
        // 選んだ人 (席表の上に、詳しい情報と操作)
        const selBar = () => {
          if (!focus) return '<div class="bd-sel empty">カードか席を押すと、その人の情報がここに出ます</div>';
          const kind = focus.arrival === '到着' ? 'done' : ((!_bdPaid_(focus) || focus.isHold) ? 'attn' : 'ready');
          return '<div class="bd-sel">'
            + '<div class="bd-sel-main"><div class="bc-l1"><span class="bc-name">' + escapeHtml(focus.name || '') + '</span><span class="bc-kana">' + escapeHtml(focus.kana || '') + '</span>'
            + '<span class="bc-time">' + (focus.arrival === '到着' ? '入場済み ' + escapeHtml(String(focus.checkinAt || '').slice(11, 16)) : 'まだ来ていない') + ' · ' + escapeHtml(focus.count) + '枚</span></div>'
            + '<div class="bc-l2">' + seatOf(focus) + chipsOf(focus) + tagsOf(focus) + '<span class="bc-tt">' + escapeHtml(focus.ticketType || '') + '</span></div>' + notesOf(focus) + '</div>'
            + '<div class="bc-act">' + actsOf(focus, kind) + '<button type="button" class="bc-sub" onclick="boardFocus(\'\')">✕ 閉じる</button></div>'
            + '</div>';
        };
        // 最近の入場 (折りたたみ。はじめは閉じる)
        const feedRows = arrived.slice().sort((a, b) => String(b.checkinAt || '').localeCompare(String(a.checkinAt || ''))).slice(0, 40);
        const latest = feedRows[0];
        const recent = '<details class="bd-recent"' + (boardState.recentOpen ? ' open' : '') + ' ontoggle="boardState.recentOpen=this.open">'
          + '<summary><span>最近の入場</span><b>' + arrived.length + '件</b>'
          + (latest ? '<em>最新 ' + escapeHtml(String(latest.checkinAt || '').slice(11, 16)) + ' ' + escapeHtml(latest.name || '') + ' 様</em>' : '') + '</summary>'
          + '<div class="bd-recent-list">' + (feedRows.map((x) => '<div class="bd-rr" onclick="boardFocus(\'' + escapeAttr(x._uid) + '\')">'
            + '<span class="t">' + escapeHtml(String(x.checkinAt || '').slice(11, 16) || '--:--') + '</span>'
            + '<span class="nm">' + escapeHtml(x.name || '') + '</span>'
            + '<span class="c">' + escapeHtml(x.count) + '枚</span>'
            + (x.seats ? '<span class="bc-seat">' + escapeHtml(x.seats) + '</span>' : '')
            + (x.support ? '<span class="bc-oshi sm">推し <b>' + escapeHtml(x.support) + '</b></span>' : '')
            + (_bdGiftTarget_(x) && !x.benefit ? '<span class="bc-gift sm">🎁 まだ</span>' : '')
            + '</div>').join('') || '<div class="bd-empty">まだありません</div>') + '</div></details>';

        // ---- 上 (回の選択・数字) と検索欄。検索欄は描き直さない (日本語の変換中に描き直すと変換が途切れるため) ----
        if (!document.getElementById('bd-search')) {
          panel.innerHTML = '<div id="bd-head"></div>'
            + '<input type="search" id="bd-search" class="bd-search" data-no-autosave placeholder="🔍 名前・カナ・受付番号・電話の下4桁"'
            + ' oninput="if(!event.isComposing){boardState.q=this.value; renderBoard(false);}" oncompositionend="boardState.q=this.value; renderBoard(false);">'
            + '<div id="bd-body"></div>';
          document.getElementById('bd-search').value = boardState.q || '';
        }
        const stat = (label, val, cls, title) => '<div class="bd-stat' + (cls ? ' ' + cls : '') + '"' + (title ? ' title="' + escapeAttr(title) + '"' : '') + '><span>' + label + '</span><b>' + val + '</b></div>';
        document.getElementById('bd-head').innerHTML = '<div class="bd-top">'
          + '<select id="bd-show" data-no-autosave onchange="boardState.show=this.value; boardState.autoShow=false; boardState.focus=\'\'; renderBoard(false);">' + showOpts + '</select>'
          + '<div class="bd-prog"><div class="l"><span>到着</span><b>' + arrivedN + '</b><small>/ ' + reserved + '枚 · ' + pct + '%</small></div><div class="bd-bar"><i style="width:' + pct + '%"></i></div></div>'
          + stat('未着', sum(waiting) + '<small>枚</small>')
          + stat('要対応', attn.length + '<small>件</small>', attn.length ? 'warn' : '', '未入金・当日精算')
          + stat('受け取る金額', yen(toCollect), toCollect ? 'warn' : '')
          + (giftAll.length ? stat('🎁 特典まだ', giftLeft + '<small>件</small>', giftLeft ? 'gift' : 'ok', '入場したのにまだ渡していない件数') : '')
          + '</div>';

        const tab = (k, label, n, cls) => '<button type="button" class="' + (boardState.leftTab === k ? 'on ' : '') + (cls || '') + '" onclick="boardState.leftTab=\'' + k + '\'; renderBoard(false);">' + label + (n != null ? ' <b>' + n + '</b>' : '') + '</button>';
        const sortBtn = (v, label) => '<button type="button" class="' + (boardState.sort === v ? 'on' : '') + '" onclick="boardState.sort=\'' + v + '\'; renderBoard(false);">' + label + '</button>';
        const lt = boardState.leftTab;
        const body = lt === 'attn' ? list(attn, 'attn') : lt === 'done' ? list(arrived, 'done') : lt === 'gift' ? giftList() : list(ready, 'ready');
        const seatPane = checkinState.seatGrid
          ? '<div class="bd-map">' + _bdSeatMap_(items, q ? items.filter(hit) : null) + '</div>'
          : '<div class="bd-map nomap"><div class="bd-empty">この公演は座席を登録していないので、席表はありません</div></div>';
        document.getElementById('bd-body').innerHTML = '<div class="bd-layout">'
          + '<section class="bd-left">'
          +   '<div class="bd-tabs">' + tab('ready', '未着', ready.filter(hit).length)
          +     tab('attn', '要対応', attn.filter(hit).length, attn.length ? 'warn' : '')
          +     tab('done', '到着済み', arrived.filter(hit).length)
          +     (giftAll.length ? tab('gift', '🎁 特典', giftLeft ? giftLeft + ' まだ' : '✓', 'gift') : '') + '</div>'
          +   (lt === 'gift' ? '' : '<div class="bd-sort"><span>並び</span>' + sortBtn('no', '受付順') + sortBtn('name', '名前順') + sortBtn('cast', '推し順') + '</div>')
          +   '<div class="bd-list">' + body + '</div>'
          + '</section>'
          + '<section class="bd-right">' + selBar() + seatPane + recent + '</section>'
          + '</div>';
        _bdFit_();
      }
      // v7.39: カードや最近の入場を押した時 — その人を選び、席表で席を光らせる (もう一度押すと外す)
      function boardFocus(uid) {
        boardState.focus = uid && boardState.focus !== uid ? uid : '';
        renderBoard(false);
      }
      // v5.94: 列の高さを「画面の下端 − 列の上端 − 到着済みの行」に合わせ、ページ全体がスクロールしないようにする
      function _bdFit_() {
        const cols = document.querySelector('#board-panel .bd-layout');   // v7.39
        if (!cols || !cols.offsetParent) return;
        if (getComputedStyle(cols).gridTemplateColumns.split(' ').length < 2) { cols.style.height = ''; return; }
        const top = cols.getBoundingClientRect().top;
        cols.style.height = Math.max(300, Math.floor(window.innerHeight - top - 14)) + 'px';
      }
      window.addEventListener('resize', () => { try { _bdFit_(); } catch (e) { } });
      // v6.03: 保存中・保存直後の自動更新は「保存前の古い一覧」の可能性があるので使わない (画面が未着に戻って見える問題)
      const _ckSaveTrack = { pending: 0, lastDone: 0 };
      function _ckSaveBegin_() { _ckSaveTrack.pending++; }
      function _ckSaveEnd_() { _ckSaveTrack.pending = Math.max(0, _ckSaveTrack.pending - 1); _ckSaveTrack.lastDone = Date.now(); }
      function _ckIsStale_(startedAt) { return _ckSaveTrack.pending > 0 || _ckSaveTrack.lastDone >= startedAt; }
      function _boardUpdate_(x, upd, okMsg) {
        const prev = { arrival: x.arrival, paymentStatus: x.paymentStatus, checkinAt: x.checkinAt, benefit: x.benefit, deskNote: x.deskNote };
        Object.assign(x, upd);
        if (upd.arrival === '到着' && !x.checkinAt) {
          const d = new Date(), p = (n) => String(n).padStart(2, '0');
          x.checkinAt = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }
        if (upd.arrival === '未着') x.checkinAt = '';
        x._orig = x._orig || {}; CK_SAVE_FIELDS.forEach((f) => { x._orig[f] = String(x[f] == null ? '' : x[f]); });
        renderBoard(false);
        // v6.03: 通信が一瞬切れた・混み合った時は1回だけ自動でやり直す
        let tries = 0;
        const send = () => {
          _ckSaveBegin_();
          _ckRun_()
            .withSuccessHandler((r) => {
              _ckSaveEnd_();
              if (r && r.skipped) { alert('予約が見つかりませんでした。画面を読み直してください'); Object.assign(x, prev); renderBoard(false); return; }
              toast(okMsg, 'success');
            })
            .withFailureHandler((e) => {
              _ckSaveEnd_();
              if (++tries < 2) { setTimeout(send, 1500); return; }
              Object.assign(x, prev); renderBoard(false);
              alert((x.name || '') + ' 様の変更を保存できませんでした。もう一度押してください。\n' + (e && e.message ? e.message : e));
            })
            .updateCheckinStatuses(state.id, [Object.assign({ sheet: x.sheet, rowIndex: x.rowIndex, receiveNo: x.receiveNo || '' }, upd)]);
        };
        send();
      }
      function boardCheckin(uid, pay) {
        const x = _bdAll_().find((i) => i._uid === uid);
        if (!x) return;
        if (pay && !confirm((x.name || '') + ' 様 ' + x.count + '枚\n' + yen(x.total) + ' を' + (pay === '現金' ? '現金' : 'キャッシュレス') + 'で受け取り、入場にします。よろしいですか？')) return;
        const upd = { arrival: '到着' };
        if (pay) upd.paymentStatus = pay;
        _boardUpdate_(x, upd, (x.name || '') + ' 様を入場にしました');
      }
      function boardBenefit(uid, on) {
        const x = _bdAll_().find((i) => i._uid === uid);
        if (!x) return;
        const d = new Date();
        const v = on ? '済 ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') : '';
        _boardUpdate_(x, { benefit: v }, (x.name || '') + ' 様: 特典を' + (on ? '渡した' : 'まだ') + 'にしました');
      }
      // v7.38: 受付メモ (スタッフだけが見る。お客様の「備考」とは別の列)
      function boardNote(uid) {
        const x = _bdAll_().find((i) => i._uid === uid);
        if (!x) return;
        const v = prompt((x.name || '') + ' 様の受付メモ (スタッフだけが見ます。空にすると消えます)', x.deskNote || '');
        if (v === null) return;
        const t = String(v).trim().slice(0, 300);
        if (t === String(x.deskNote || '')) return;
        _boardUpdate_(x, { deskNote: t }, (x.name || '') + ' 様: 受付メモを' + (t ? '保存' : '消去') + 'しました');
      }
      // v7.38: その回の席表。入場済み (緑) / まだ来ていない (青) / 空席。v7.39: 選んだ人の席は太枠、検索で当たった人の席は赤枠
      function _bdSeatMap_(items, hits) {
        const g = checkinState.seatGrid;
        const split = (s) => String(s || '').normalize('NFKC').split(/[\s,、・/]+/).map((t) => t.trim()).filter(Boolean);
        const bySeat = {};
        items.forEach((x) => split(x.seats).forEach((sid) => { bySeat[sid] = x; }));
        const hitSet = hits ? new Set(hits.map((x) => x._uid)) : null;
        const at = {};
        g.cells.forEach((c) => { at[c.row + ':' + c.col] = c; });
        let seatN = 0, arrivedN = 0, resvN = 0;
        let cells = '';
        for (let r = 1; r <= g.rows; r++) {
          for (let col = 1; col <= g.cols; col++) {
            const c = at[r + ':' + col];
            if (!c || c.type !== 'seat' || !c.seatId) { cells += '<div class="bd-seat bs-gap"></div>'; continue; }
            seatN++;
            const x = bySeat[c.seatId];
            let cls = 'bs-empty', tip = c.seatId + ' 空席', click = '';
            if (x) {
              cls = x.arrival === '到着' ? 'bs-in' : 'bs-resv';
              if (cls === 'bs-in') arrivedN++; else resvN++;
              tip = c.seatId + ' ' + (x.name || '') + ' 様' + (x.support ? ' / 推し ' + x.support : '') + (x.arrival === '到着' ? ' / 入場済み' : ' / まだ') + (x.deskNote ? ' / 📝 ' + x.deskNote : '');
              click = ' onclick="boardSeatPick(\'' + escapeAttr(x._uid) + '\')"';
              if (hitSet && hitSet.has(x._uid)) cls += ' bs-hit';
              if (x._uid === boardState.focus) cls += ' bs-focus';
              if (_bdGiftTarget_(x) && !x.benefit) cls += ' bs-gift';
            }
            cells += '<div class="bd-seat ' + cls + '" title="' + escapeAttr(tip) + '"' + click + '>' + escapeHtml(c.seatId) + '</div>';
          }
        }
        const free = items.filter((x) => !split(x.seats).length);
        const freeN = free.reduce((n, x) => n + (Number(x.count) || 0), 0);
        return '<div class="bd-maphead"><b>席表</b>'
          + '<span class="lg"><i class="bs-in"></i>入場 ' + arrivedN + '</span><span class="lg"><i class="bs-resv"></i>まだ ' + resvN + '</span><span class="lg"><i class="bs-empty"></i>空き ' + (seatN - arrivedN - resvN) + '</span><span class="lg"><i class="bs-gift"></i>特典まだ</span>'
          + (freeN ? '<span class="lg free">自由席など ' + freeN + '枚</span>' : '') + '</div>'
          + '<div class="bd-stage">舞 台</div>'
          + '<div class="bd-seatgrid" style="--cols:' + g.cols + '; grid-template-columns:repeat(' + g.cols + ', minmax(0, 1fr));">' + cells + '</div>';
      }
      // v7.39: 席を押した時 — その人を選び、一覧の入っているタブに切り替えてカードを見せる
      function boardSeatPick(uid) {
        const x = _bdAll_().find((i) => i._uid === uid);
        if (!x) return;
        boardState.focus = uid;
        boardState.leftTab = x.arrival === '到着' ? 'done' : ((!_bdPaid_(x) || x.isHold) ? 'attn' : 'ready');
        renderBoard(false);
        const el = document.querySelector('#board-panel .bc[data-uid="' + String(uid).replace(/"/g, '\\"') + '"]');
        if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      function boardUndo(uid) {
        const x = _bdAll_().find((i) => i._uid === uid);
        if (!x || !confirm((x.name || '') + ' 様を「未着」に戻しますか？')) return;
        _boardUpdate_(x, { arrival: '未着' }, '未着に戻しました');
      }

  </script>
</body>
